name: Documentation
description: Fix or improve public docs
title: "[docs] "
labels: ["documentation", "good first issue"]
body:
  - type: input
    id: path
    attributes:
      label: Doc path or URL
      placeholder: "docs/public-alpha-roadmap.md"
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is wrong or missing?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix (optional)
