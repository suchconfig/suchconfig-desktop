[package]
name = "suchconfig_vault_core"
version = "0.1.0"
edition = "2021"
description = "CRDT core for SuchConfig Project Vault items (Loro-backed). Lives next to env_crypto so future SuchConfig consumers (desktop, agent, CLI) share one trust boundary."
license = "Apache-2.0"

[lib]
name = "suchconfig_vault_core"
crate-type = ["rlib"]

[dependencies]
loro = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
proptest = "1.5"

[workspace]
