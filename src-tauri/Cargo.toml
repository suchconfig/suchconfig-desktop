[package]
name = "suchconfig"
version = "0.1.1"
description = "SuchConfig App - Tauri shell for Phoenix LiveView"
authors = ["you"]
edition = "2021"
default-run = "suchconfig"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "suchconfig_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-biometry = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "io-util"] }
ureq = "2.10"
url = "2.5"
base64 = "0.22"
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
notify = "7"
tracing = "0.1"
sha2 = "0.10"
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
hex = "0.4"
parking_lot = "0.12"
ed25519-dalek = { version = "2", features = ["rand_core"] }
uuid = { version = "1", features = ["v4", "serde"] }
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
hostname = "0.4"
mdns-sd = "0.11"
socket2 = "0.5"
libc = "0.2"
iroh = "1"
iroh-mdns-address-lookup = "0.4"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["linux-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

